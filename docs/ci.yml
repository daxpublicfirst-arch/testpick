name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test ./...
      - run: make build
      - run: ./bin/testpick self-test
      - run: ./bin/testpick doctor
